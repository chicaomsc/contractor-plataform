spring:
  application:
    name: platform-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/platform_db}
    username: ${DB_USERNAME:platform}
    password: ${DB_PASSWORD:platform}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  mvc:
    problemdetails:
      enabled: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-at-least-32-chars-change-in-prod!}
    access-token-ttl: 900       # 15 minutes (seconds)
    refresh-token-ttl: 2592000  # 30 days (seconds)
    # Required and checked on every parse (Sprint 11B.6D) — a token minted for a
    # different deployment/environment is rejected even if it has a valid signature.
    issuer: ${JWT_ISSUER:contractor-platform}
    audience: ${JWT_AUDIENCE:contractor-platform-api}
    clock-skew-seconds: ${JWT_CLOCK_SKEW_SECONDS:30}
  security:
    # BCryptPasswordEncoder's own default is 10 — SEC-AUTH-10/DT-011B.5 §9 raises it
    # to 12. Existing hashes keep validating (BCrypt encodes its own cost factor in
    # the hash string); only newly-created hashes use the new strength. See
    # docs/operations/runbook.md for the rehash-on-login strategy this enables.
    bcrypt-strength: ${BCRYPT_STRENGTH:12}
  storage:
    base-path: ${STORAGE_PATH:./storage}
  image-normalization:
    # Enforced before ImageIO decodes the full pixel buffer — rejects decompression-bomb-
    # style images (tiny file, huge declared dimensions) reading only the header first.
    # See ImageNormalizationService (Sprint 11B.6C, SEC-STORAGE-02).
    max-width-px: ${IMAGE_MAX_WIDTH_PX:6000}
    max-height-px: ${IMAGE_MAX_HEIGHT_PX:6000}
    max-pixels: ${IMAGE_MAX_PIXELS:30000000}
    jpeg-quality: ${IMAGE_JPEG_QUALITY:0.85}
  platform:
    # Base domain used to extract a tenant slug from a Host value ("{slug}.{base-domain}")
    # at GET /public/tenant — see DT-011A.7 §16. "localhost" is correct for local/E2E
    # validation via *.localhost; no real domain exists yet (Sprint 11C).
    base-domain: ${PLATFORM_BASE_DOMAIN:localhost}
    # Temporary fallback tenant used when Host doesn't resolve to any known subdomain —
    # explicitly a transition mechanism, not permanent architecture (DT §16/§22/§24).
    default-tenant-slug: ${PLATFORM_DEFAULT_TENANT_SLUG:}
    # Platform-wide frontend origin used to build absolute links the backend hands out
    # directly — today: the password-reset link (DT-011A.10 §3/§13). Not tenant-specific.
    frontend-base-url: ${PLATFORM_FRONTEND_BASE_URL:http://localhost:3000}
  password-reset:
    # 30 minutes — see DT-011A.10 §7.
    token-ttl: ${PASSWORD_RESET_TOKEN_TTL:1800}
    # 3 minutes — see DT-011A.10 §7.
    request-cooldown: ${PASSWORD_RESET_REQUEST_COOLDOWN:180}
  admin-bootstrap:
    # Read once at startup by PlatformAdminBootstrapRunner to create the first
    # SUPER_ADMIN — idempotent, fails fast if only one of the two is set. See DT §8.
    email: ${PLATFORM_ADMIN_BOOTSTRAP_EMAIL:}
    password: ${PLATFORM_ADMIN_BOOTSTRAP_PASSWORD:}
  rate-limit:
    # In-memory only, authentication endpoints only — never global (DT-011B.5 §9 HARD-01,
    # SEC-AUTH-03). Keyed by remote address + path; disabled entirely in the shared test
    # context (AbstractIntegrationTest) to avoid unrelated tests tripping the limiter.
    enabled: ${AUTH_RATE_LIMIT_ENABLED:true}
    # Sprint 12.4.2 (RR-06) — self-serve signup, no auth required to call it.
    register:
      capacity: ${AUTH_RATE_LIMIT_REGISTER_CAPACITY:5}
      window-seconds: ${AUTH_RATE_LIMIT_REGISTER_WINDOW_SECONDS:3600}
    login:
      capacity: ${AUTH_RATE_LIMIT_LOGIN_CAPACITY:10}
      window-seconds: ${AUTH_RATE_LIMIT_LOGIN_WINDOW_SECONDS:60}
    # Sprint 12.4.2 (RR-07) — access tokens expire every 15 min (app.jwt.access-token-ttl
    # above), so one active session needs at most 4/hour; 20 leaves headroom for
    # multiple tabs/devices while still bounding sustained abuse of a leaked token.
    refresh:
      capacity: ${AUTH_RATE_LIMIT_REFRESH_CAPACITY:20}
      window-seconds: ${AUTH_RATE_LIMIT_REFRESH_WINDOW_SECONDS:3600}
    forgot-password:
      capacity: ${AUTH_RATE_LIMIT_FORGOT_PASSWORD_CAPACITY:5}
      window-seconds: ${AUTH_RATE_LIMIT_FORGOT_PASSWORD_WINDOW_SECONDS:60}
    reset-password:
      capacity: ${AUTH_RATE_LIMIT_RESET_PASSWORD_CAPACITY:10}
      window-seconds: ${AUTH_RATE_LIMIT_RESET_PASSWORD_WINDOW_SECONDS:60}
    invite-accept:
      capacity: ${AUTH_RATE_LIMIT_INVITE_ACCEPT_CAPACITY:10}
      window-seconds: ${AUTH_RATE_LIMIT_INVITE_ACCEPT_WINDOW_SECONDS:60}
    admin-password-reset:
      capacity: ${AUTH_RATE_LIMIT_ADMIN_PASSWORD_RESET_CAPACITY:10}
      window-seconds: ${AUTH_RATE_LIMIT_ADMIN_PASSWORD_RESET_WINDOW_SECONDS:60}

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
  show-actuator: false

info:
  app:
    name: ${spring.application.name}
    version: '@project.version@'
