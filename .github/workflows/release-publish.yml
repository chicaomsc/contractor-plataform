name: Release — Publish Images

# Artifact publication (Sprint 2C, revisado na 2C.1 — ver DT-013). Responsabilidade
# ÚNICA deste workflow: a partir de uma release já criada por release.yml, buildar
# e publicar as três imagens com tag SemVer imutável, capturar os digests reais do
# GHCR, gerar o release-manifest.yml (schema platform-ops/v1) e abrir a PR de
# promoção no platform-ops. NUNCA decide versão, NUNCA cria tag/release — isso é
# exclusivo de release.yml.
#
# Gatilhos (dois, deliberados):
#   - workflow_dispatch (inputs `version`, `sha`) — caminho real usado hoje:
#     release.yml dispara isto explicitamente após criar a release, com outputs
#     explícitos (não uma tag_name para fazer parsing — ver DT-013 §"Bug real
#     corrigido"). GITHUB_TOKEN não dispara `release: published` quando a própria
#     GITHUB_TOKEN criou a release (proteção anti-recursão do GitHub) —
#     workflow_dispatch é a exceção documentada a essa restrição.
#   - release: published — gatilho semanticamente correto para o caso (hoje
#     hipotético) de uma release ser publicada por um humano ou por um token que
#     não seja o GITHUB_TOKEN padrão do job de release.yml; dispara sozinho nesse
#     caso, sem precisar do dispatch explícito.
#
# Nunca dispara em push normal para main — isso continua sendo publish-images.yml
# (SHA/short-SHA/main, inalterado), o caminho técnico/dev independente da release
# SemVer.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão SemVer a publicar (ex.: 1.2.0), sem prefixo de tag.'
        required: true
      sha:
        description: 'SHA completo (40 chars) do commit de origem da release.'
        required: true

concurrency:
  group: release-publish-${{ github.event.inputs.version || github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  BACKEND_IMAGE: ghcr.io/chicaomsc/contractor-platform-backend
  FRONTEND_IMAGE: ghcr.io/chicaomsc/contractor-platform-frontend
  CADDY_IMAGE: ghcr.io/chicaomsc/contractor-platform-caddy
  PLATFORM_OPS_REPO: chicaomsc/platform-ops
  APPLICATION: vantry
  APP_ENVIRONMENT: production

jobs:
  resolve:
    name: Resolve version and commit
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.info.outputs.tag }}
      version: ${{ steps.info.outputs.version }}
      sha: ${{ steps.info.outputs.sha }}
    steps:
      # Sempre faz checkout ANTES de qualquer comando git — esta parte nunca foi
      # a causa do bug real da Sprint 2C.1 (o bug estava em release-please.yml,
      # num job que nunca fazia checkout algum; aqui o checkout sempre existiu).
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.sha || github.event.release.tag_name }}
          fetch-depth: 1

      - name: Resolve version, commit and tag
        id: info
        run: |
          set -euo pipefail
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            # Caminho real: outputs explícitos vindos de release.yml — nenhum
            # parsing de string de tag necessário (ver DT-013).
            VERSION="${{ github.event.inputs.version }}"
          else
            # Caminho fallback (release: published, sem dispatch): a tag real
            # criada por semantic-release usa o formato "vantry-v<versão>"
            # (tagFormat em .releaserc.json) — confirmado empiricamente contra
            # a release vantry-v1.0.0 real. Nunca assumir prefixo "v" simples.
            TAG="${{ github.event.release.tag_name }}"
            VERSION="${TAG#vantry-v}"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Versão resolvida '${VERSION}' não é SemVer válido (esperado MAJOR.MINOR.PATCH)."
            exit 1
          fi

          SHA="$(git rev-parse HEAD)"
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::SHA resolvido não tem o formato esperado (40 hex): ${SHA}"
            exit 1
          fi

          TAG="vantry-v${VERSION}"
          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            echo "sha=${SHA}"
          } >> "$GITHUB_OUTPUT"
          echo "Release ${TAG} -> versão ${VERSION}, commit ${SHA}"

  ci-backend:
    name: Backend CI (gate)
    needs: resolve
    uses: ./.github/workflows/backend-ci.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  ci-frontend:
    name: Frontend CI (gate)
    needs: resolve
    uses: ./.github/workflows/frontend-ci.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  # Item 8 da Sprint 2C: uma release é imutável. Falha ANTES de gastar tempo de
  # build se qualquer uma das três tags já existir no GHCR — nunca sobrescreve
  # 1.0.0/1.0.1/etc. Roda antes dos builds (fail fast), não só antes do push.
  # Também cobre idempotência de rerun (item 15): reexecutar este workflow para
  # uma versão já publicada falha aqui, de forma clara, em vez de sobrescrever.
  check-immutability:
    name: Verify tags don't already exist (immutability)
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail if any image:tag already exists
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve.outputs.version }}"
          for IMAGE in "${{ env.BACKEND_IMAGE }}" "${{ env.FRONTEND_IMAGE }}" "${{ env.CADDY_IMAGE }}"; do
            if docker manifest inspect "${IMAGE}:${VERSION}" >/dev/null 2>&1; then
              echo "::error::${IMAGE}:${VERSION} já existe no GHCR. Uma release publicada é imutável e nunca é sobrescrita. Se for necessário corrigir algo, publique a próxima versão (ex.: um PATCH) em vez de reusar ${VERSION}."
              exit 1
            fi
            echo "OK: ${IMAGE}:${VERSION} ainda não existe — livre para publicar."
          done

  # --- Fase de build (SEM push) — valida que os TRÊS Dockerfiles buildam antes
  # de qualquer push ser tentado (item 17: minimiza a janela de risco de
  # publicação parcial). O cache (type=gha) é reaproveitado no job "publish".

  build-backend:
    name: Build backend (validate, no push)
    needs: [resolve, check-immutability, ci-backend, ci-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    name: Build frontend (validate, no push)
    needs: [resolve, check-immutability, ci-backend, ci-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Validate required GitHub Actions Variables
        run: |
          missing=()
          [ -z "${{ vars.NEXT_PUBLIC_API_BASE_URL }}" ] && missing+=(NEXT_PUBLIC_API_BASE_URL)
          [ -z "${{ vars.NEXT_PUBLIC_SITE_URL }}" ] && missing+=(NEXT_PUBLIC_SITE_URL)
          [ -z "${{ vars.NEXT_PUBLIC_PLATFORM_BASE_DOMAIN }}" ] && missing+=(NEXT_PUBLIC_PLATFORM_BASE_DOMAIN)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required GitHub Actions Variables: ${missing[*]}. See infra/README.md (\"GitHub Actions Variables\")."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          platforms: linux/amd64
          push: false
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_PLATFORM_BASE_DOMAIN=${{ vars.NEXT_PUBLIC_PLATFORM_BASE_DOMAIN }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  build-caddy:
    name: Build caddy (validate, no push)
    needs: [resolve, check-immutability]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: infra/caddy
          file: infra/caddy/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=caddy
          cache-to: type=gha,mode=max,scope=caddy

  # --- Fase de publicação — só roda se os TRÊS builds acima já validaram.
  publish:
    name: Publish images + release manifest
    needs: [resolve, build-backend, build-frontend, build-caddy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      backend-digest: ${{ steps.build-backend.outputs.digest }}
      frontend-digest: ${{ steps.build-frontend.outputs.digest }}
      caddy-digest: ${{ steps.build-caddy.outputs.digest }}
      created-at: ${{ steps.manifest.outputs.created-at }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata — backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.resolve.outputs.version }}
            type=raw,value=sha-${{ needs.resolve.outputs.sha }}

      - name: Build and push — backend
        id: build-backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Docker metadata — frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.resolve.outputs.version }}
            type=raw,value=sha-${{ needs.resolve.outputs.sha }}

      - name: Build and push — frontend
        id: build-frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_PLATFORM_BASE_DOMAIN=${{ vars.NEXT_PUBLIC_PLATFORM_BASE_DOMAIN }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Docker metadata — caddy
        id: meta-caddy
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.CADDY_IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.resolve.outputs.version }}
            type=raw,value=sha-${{ needs.resolve.outputs.sha }}

      - name: Build and push — caddy
        id: build-caddy
        uses: docker/build-push-action@v6
        with:
          context: infra/caddy
          file: infra/caddy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-caddy.outputs.tags }}
          labels: ${{ steps.meta-caddy.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=caddy
          cache-to: type=gha,mode=max,scope=caddy

      # Item 16 — se chegamos até aqui e uma das três falhou, as anteriores já
      # foram publicadas e não há como desfazer isso com segurança. Este passo
      # só roda em falha e marca a release como contaminada no log/summary —
      # nunca tenta limpar/reusar automaticamente.
      - name: Partial publish warning (only runs on failure)
        if: failure()
        run: |
          echo "::warning::Publicação da release ${{ needs.resolve.outputs.tag }} FALHOU no meio do processo. Verifique manualmente no GHCR quais das três imagens (backend/frontend/caddy) foram de fato publicadas com a tag ${{ needs.resolve.outputs.version }}. Esta versão está CONTAMINADA — NUNCA reutilize-a. Corrija a causa raiz e publique a PRÓXIMA versão (ex.: um PATCH)."
          echo "### ⚠️ Publicação parcial — ${{ needs.resolve.outputs.tag }} CONTAMINADA" >> "$GITHUB_STEP_SUMMARY"
          echo "Verifique manualmente quais imagens foram publicadas no GHCR. Esta versão (${{ needs.resolve.outputs.version }}) nunca deve ser reutilizada — publique a próxima." >> "$GITHUB_STEP_SUMMARY"

      - name: Generate release-manifest.yml
        id: manifest
        run: |
          set -euo pipefail
          CREATED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "created-at=${CREATED_AT}" >> "$GITHUB_OUTPUT"
          cat > release-manifest.yml <<EOF
          apiVersion: platform-ops/v1
          kind: Release

          metadata:
            application: ${{ env.APPLICATION }}
            environment: ${{ env.APP_ENVIRONMENT }}

          release:
            version: "${{ needs.resolve.outputs.version }}"
            sourceCommit: "${{ needs.resolve.outputs.sha }}"
            createdAt: "${CREATED_AT}"

          components:
            backend:
              image: ${{ env.BACKEND_IMAGE }}
              tag: "${{ needs.resolve.outputs.version }}"
              digest: "${{ steps.build-backend.outputs.digest }}"
            frontend:
              image: ${{ env.FRONTEND_IMAGE }}
              tag: "${{ needs.resolve.outputs.version }}"
              digest: "${{ steps.build-frontend.outputs.digest }}"
            caddy:
              image: ${{ env.CADDY_IMAGE }}
              tag: "${{ needs.resolve.outputs.version }}"
              digest: "${{ steps.build-caddy.outputs.digest }}"
          EOF
          cat release-manifest.yml

      - name: Upload release-manifest.yml as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ needs.resolve.outputs.version }}
          path: release-manifest.yml
          if-no-files-found: error

      - name: Attach release-manifest.yml to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${{ needs.resolve.outputs.tag }}" release-manifest.yml --clobber

      - name: Summary
        run: |
          {
            echo "### Release ${{ needs.resolve.outputs.tag }} publicada"
            echo ""
            echo "| Componente | Tag | Digest |"
            echo "|---|---|---|"
            echo "| backend | \`${{ needs.resolve.outputs.version }}\` | \`${{ steps.build-backend.outputs.digest }}\` |"
            echo "| frontend | \`${{ needs.resolve.outputs.version }}\` | \`${{ steps.build-frontend.outputs.digest }}\` |"
            echo "| caddy | \`${{ needs.resolve.outputs.version }}\` | \`${{ steps.build-caddy.outputs.digest }}\` |"
            echo ""
            echo "Source commit: \`${{ needs.resolve.outputs.sha }}\`"
            echo ""
            echo "\`release-manifest.yml\` anexado à [GitHub Release](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.resolve.outputs.tag }}) e disponível como artifact desta execução."
          } >> "$GITHUB_STEP_SUMMARY"

  # Item 12 da Sprint 2C.1: gate de produção. Abre (ou confirma que já existe,
  # de forma idempotente) uma PR no platform-ops atualizando
  # apps/vantry/production/release.yml com os valores reais desta release —
  # aprovação humana dessa PR é o único caminho até produção (deploy-production.yml
  # continua workflow_dispatch manual no platform-ops, inalterado).
  promote-platform-ops:
    name: Open promotion PR in platform-ops
    needs: [resolve, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      # Nunca duas promoções simultâneas do mesmo app/ambiente no platform-ops
      # (item 17), independente de quantas releases diferentes de vantry
      # estejam em voo (o group não inclui a versão, deliberadamente).
      # Valor fixo (não via `env.*`) porque `concurrency` não tem acesso ao
      # contexto `env` no nível de job — este workflow é específico do vantry.
      group: promote-platform-ops-vantry-production
      cancel-in-progress: false
    steps:
      - name: Verify PLATFORM_OPS_TOKEN is configured
        run: |
          if [[ -z "${TOKEN}" ]]; then
            echo "::error::secrets.PLATFORM_OPS_TOKEN não está configurado neste repositório. Este token é necessário para abrir a PR de promoção no platform-ops (contents:write + pull-requests:write, restrito ao repositório ${{ env.PLATFORM_OPS_REPO }}). Ver docs/design/DT-013-release-pipeline.md § Autenticação cross-repo e platform-ops/docs/runbooks/setup-platform-ops-token.md para o procedimento de setup manual."
            exit 1
          fi
        env:
          TOKEN: ${{ secrets.PLATFORM_OPS_TOKEN }}

      - name: Checkout platform-ops
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PLATFORM_OPS_REPO }}
          token: ${{ secrets.PLATFORM_OPS_TOKEN }}
          path: platform-ops
          fetch-depth: 0

      # Idempotência (item 15): se a branch/PR de promoção para esta versão já
      # existir (rerun deste workflow, ou re-dispatch manual), não duplica —
      # apenas reporta e encerra com sucesso.
      - name: Check for existing promotion branch/PR (idempotency)
        id: existing
        working-directory: platform-ops
        env:
          GH_TOKEN: ${{ secrets.PLATFORM_OPS_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="promote/${{ env.APPLICATION }}-${{ needs.resolve.outputs.version }}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Branch ${BRANCH} já existe em ${{ env.PLATFORM_OPS_REPO }} — promoção para ${{ needs.resolve.outputs.version }} já foi iniciada anteriormente. Nenhuma PR duplicada será criada. Verifique manualmente: https://github.com/${{ env.PLATFORM_OPS_REPO }}/pulls?q=head:${BRANCH}"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Read previous release.yml (if any)
        if: steps.existing.outputs.exists == 'false'
        id: previous
        working-directory: platform-ops
        run: |
          set -euo pipefail
          FILE="apps/${{ env.APPLICATION }}/${{ env.APP_ENVIRONMENT }}/release.yml"
          if [[ -f "$FILE" ]]; then
            PREV="$(grep -m1 '^\s*version:' "$FILE" | sed -E 's/.*version:\s*"?([0-9]+\.[0-9]+\.[0-9]+)"?.*/\1/')"
            echo "version=${PREV}" >> "$GITHUB_OUTPUT"
          else
            echo "version=(nenhuma — primeira promoção)" >> "$GITHUB_OUTPUT"
          fi

      - name: Write apps/vantry/production/release.yml
        if: steps.existing.outputs.exists == 'false'
        working-directory: platform-ops
        run: |
          set -euo pipefail
          FILE="apps/${{ env.APPLICATION }}/${{ env.APP_ENVIRONMENT }}/release.yml"
          mkdir -p "$(dirname "$FILE")"
          cat > "$FILE" <<EOF
          apiVersion: platform-ops/v1
          kind: Release

          metadata:
            application: ${{ env.APPLICATION }}
            environment: ${{ env.APP_ENVIRONMENT }}

          release:
            version: "${{ needs.resolve.outputs.version }}"
            sourceCommit: "${{ needs.resolve.outputs.sha }}"
            createdAt: "${{ needs.publish.outputs.created-at }}"

          components:
            backend:
              image: ${{ env.BACKEND_IMAGE }}
              tag: "${{ needs.resolve.outputs.version }}"
              digest: "${{ needs.publish.outputs.backend-digest }}"
            frontend:
              image: ${{ env.FRONTEND_IMAGE }}
              tag: "${{ needs.resolve.outputs.version }}"
              digest: "${{ needs.publish.outputs.frontend-digest }}"
            caddy:
              image: ${{ env.CADDY_IMAGE }}
              tag: "${{ needs.resolve.outputs.version }}"
              digest: "${{ needs.publish.outputs.caddy-digest }}"
          EOF
          cat "$FILE"

      - name: Commit, push and open PR
        if: steps.existing.outputs.exists == 'false'
        working-directory: platform-ops
        env:
          GH_TOKEN: ${{ secrets.PLATFORM_OPS_TOKEN }}
          BRANCH: ${{ steps.existing.outputs.branch }}
          PREVIOUS_VERSION: ${{ steps.previous.outputs.version }}
          NEW_VERSION: ${{ needs.resolve.outputs.version }}
          SOURCE_COMMIT: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add "apps/${{ env.APPLICATION }}/${{ env.APP_ENVIRONMENT }}/release.yml"
          git commit -m "chore(${{ env.APPLICATION }}): promote ${NEW_VERSION} to ${{ env.APP_ENVIRONMENT }}"
          git push origin "$BRANCH"

          BODY=$(cat <<EOF
          ## Promoção de release — ${{ env.APPLICATION }} (${{ env.APP_ENVIRONMENT }})

          | | |
          |---|---|
          | Versão anterior | \`${PREVIOUS_VERSION}\` |
          | **Nova versão** | **\`${NEW_VERSION}\`** |
          | Source commit | [\`${SOURCE_COMMIT}\`](https://github.com/${{ github.repository }}/commit/${SOURCE_COMMIT}) |
          | Release notes | https://github.com/${{ github.repository }}/releases/tag/vantry-v${NEW_VERSION} |

          ### Digests

          | Componente | Digest |
          |---|---|
          | backend | \`${{ needs.publish.outputs.backend-digest }}\` |
          | frontend | \`${{ needs.publish.outputs.frontend-digest }}\` |
          | caddy | \`${{ needs.publish.outputs.caddy-digest }}\` |

          ---

          Gerado automaticamente por [\`release-publish.yml\`](https://github.com/${{ github.repository }}/actions) em \`${{ github.repository }}\`, a partir da release [\`vantry-v${NEW_VERSION}\`](https://github.com/${{ github.repository }}/releases/tag/vantry-v${NEW_VERSION}).

          **Mergear esta PR é o gate de produção.** Nenhum deploy acontece automaticamente ao mergear — isso continua exigindo \`workflow_dispatch\` manual de \`deploy-production.yml\` neste repositório, apontando para o novo \`release.yml\`.
          EOF
          )

          gh pr create \
            --repo "${{ env.PLATFORM_OPS_REPO }}" \
            --base main \
            --head "$BRANCH" \
            --title "chore(${{ env.APPLICATION }}): promote ${NEW_VERSION} to ${{ env.APP_ENVIRONMENT }}" \
            --body "$BODY"
