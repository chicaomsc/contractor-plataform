# Contractor Platform — production container stack.
# Sprint 11A.1: backend/frontend/postgres containers.
# Sprint 11A.2: profile prod, health/readiness/liveness, resource limits.
# Sprint 11A.3: Caddy as the single public entrypoint — see
# docs/design/DT-011A.3-caddy-reverse-proxy.md.
# Sprint 11A.4: BACKEND_IMAGE/FRONTEND_IMAGE default to the real GHCR owner
# (chicaomsc) now that .github/workflows/publish-images.yml actually publishes
# there — see docs/design/DT-011A.4-ghcr-image-pipeline.md.
#
# Only `caddy` publishes a port to the host. `frontend`/`backend`/`postgres` are
# reachable only on the `internal` Docker network — Caddy reaches them by service
# name (frontend:3000, backend:8080), the same way any other container on this
# network would. This was a temporary state up through 11A.2 (frontend/backend used
# to publish ports directly for local validation); it ends here.
#
# Run with `docker compose --env-file ../env/production.env -f docker-compose.prod.yml ...`
# from this directory, or `-f infra/compose/docker-compose.prod.yml` from the repo
# root. See infra/README.md for the full command reference.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  backend_storage:
  caddy_data:
  caddy_config:

services:
  postgres:
    # Deliberately 17, not 16: both docker/docker-compose.yml (local dev) and
    # AbstractIntegrationTest (Testcontainers, the entire backend test suite) are
    # already pinned to postgres:17-alpine. Running 16 in production would mean the
    # one environment that has never actually been exercised against this schema/
    # Flyway migration set is production itself — the "necessidade diferente" this
    # choice is conditioned on.
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No `ports:` — reachable only from other containers on the `internal` network.
    # This is what actually keeps Postgres off the host/public interface; there is
    # no separate firewall step required for this guarantee.
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 900m
    mem_reservation: 500m
    # PROVISIONAL (Sprint 11A.2) — sized against an assumed ~2 vCPU/4 GB VPS that has
    # not been chosen yet. Revisit once the real Hetzner VPS is provisioned (Sprint
    # 11B) — see DT-011A.2 §6.3.2.
    cpus: "1.0"
    logging: *default-logging

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/chicaomsc/contractor-platform-backend}:${APP_VERSION:-local}
    build:
      context: ../../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../env/production.env
    environment:
      # DB_URL is composed from the same Postgres credentials/service name used
      # above, rather than duplicated as a separate variable in production.env —
      # one less place for the two to drift apart.
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Fixed here, not sourced from production.env — activating application-prod.yml
      # is a property of this compose file, not an operator choice. See DT-011A.2 §6.1.1.
      SPRING_PROFILES_ACTIVE: prod
      TZ: UTC
      JAVA_TOOL_OPTIONS: >-
        -XX:MaxRAMPercentage=70
        -XX:InitialRAMPercentage=20
        -XX:+UseG1GC
        -XX:+ExitOnOutOfMemoryError
    volumes:
      # app.storage.base-path (STORAGE_PATH) — the only directory the backend
      # writes application data to (uploaded logos/gallery images). See
      # infra/README.md for why nothing else needs a volume (PDFs are generated
      # in-memory and never touch disk).
      - backend_storage:/app/storage
    # No `ports:` since Sprint 11A.3 — only Caddy publishes a port; the backend is
    # reachable on the `internal` network as `backend:8080` (Caddy's /api/* and
    # /uploads/* rules both target it that way).
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    # 40s > the 30s spring.lifecycle.timeout-per-shutdown-phase set in
    # application-prod.yml, so the JVM's own graceful-shutdown window always has a
    # chance to finish before Docker sends SIGKILL. See DT-011A.2 §6.1.4/§6.3.4.
    stop_grace_period: 40s
    # Sprint 12.4.2 (RR-10): 45s start_period + 3×30s retries (135s total) was sized
    # against local/dev-machine cold starts, never against a shared-vCPU VPS (CPX32,
    # DT-012.4 §4) where JVM cold start + the first-ever Flyway run (14 migrations,
    # empty DB) can plausibly run slower under cgroup cpus:"1.0" + possible CPU steal
    # from noisy neighbors. 90s + 5×30s = 240s (4 min) total before Docker marks this
    # container unhealthy — a deliberate, bounded ceiling (not infinite): a backend
    # that hasn't passed a single readiness check in 4 minutes is a real failure to
    # surface, not something to keep waiting on indefinitely. If it ever proves too
    # tight in practice, `docker compose up -d` is idempotent and safe to re-run.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    mem_limit: 1400m
    mem_reservation: 900m
    # PROVISIONAL (Sprint 11A.2) — see the postgres service comment above; same
    # premise, revisit in Sprint 11B.
    cpus: "1.0"
    logging: *default-logging

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/chicaomsc/contractor-platform-frontend}:${APP_VERSION:-local}
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?NEXT_PUBLIC_API_BASE_URL is required}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        NEXT_PUBLIC_PLATFORM_BASE_DOMAIN: ${PLATFORM_BASE_DOMAIN:?PLATFORM_BASE_DOMAIN is required}
    restart: unless-stopped
    # No env_file (Sprint 12.3 security review, finding #1): the frontend does not
    # read any application secret at runtime — confirmed by `grep -Rni process.env
    # frontend/src frontend/next.config.ts`, which shows only NEXT_PUBLIC_API_BASE_URL,
    # NEXT_PUBLIC_SITE_URL, NEXT_PUBLIC_PLATFORM_BASE_DOMAIN (all three already baked
    # into the image at build time via frontend/Dockerfile ARG→ENV, not re-read from
    # the environment at container start) and API_PROXY_TARGET (dev-only, unused in
    # this compose file). A blanket `env_file: ../env/production.env` here used to
    # hand the frontend container JWT_SECRET/POSTGRES_PASSWORD/etc. for zero
    # functional benefit — least-privilege violation, removed.
    environment:
      # Already hardcoded in frontend/Dockerfile's runtime stage — redeclared here
      # too so `docker compose config`/`docker inspect` show it explicitly without
      # requiring knowledge of what the image bakes in.
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=512
    # No `ports:` since Sprint 11A.3 — only Caddy publishes a port; the frontend is
    # reachable on the `internal` network as `frontend:3000` (Caddy's catch-all rule
    # targets it that way).
    networks:
      - internal
    # Deliberately no `depends_on: backend` — the frontend renders (with empty/
    # error states already built into its data hooks) even when the API is
    # temporarily unavailable; it must be able to start and stay up independently
    # of backend health, not be gated on it.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 700m
    mem_reservation: 350m
    # PROVISIONAL (Sprint 11A.2) — see the postgres service comment above; same
    # premise, revisit in Sprint 11B.
    cpus: "0.5"
    logging: *default-logging

  caddy:
    # Custom image (Sprint 12.3, DT-012.1 §9/ADR-005) — built via xcaddy with the
    # caddy-dns/cloudflare module (infra/caddy/Dockerfile), replacing the plain
    # caddy:2-alpine image used through Sprint 12.2. Required for the ACME DNS-01
    # challenge the wildcard cert (*.{PLATFORM_BASE_DOMAIN}) needs — HTTP-01
    # (what the official image alone can do) cannot issue wildcard certificates.
    # Still runs as root (needed to bind ports 80/443 without extra capabilities;
    # unchanged from the pre-12.3 image, no new hardening decision here).
    image: ${CADDY_IMAGE:-ghcr.io/chicaomsc/contractor-platform-caddy}:${APP_VERSION:-local}
    build:
      context: ../caddy
      dockerfile: Dockerfile
    restart: unless-stopped
    # No env_file (Sprint 12.3 security review, finding #2): infra/caddy/Caddyfile
    # only ever references {$CADDY_HOST} and {env.CLOUDFLARE_API_TOKEN} — a blanket
    # `env_file: ../env/production.env` here used to hand the ONE internet-facing
    # container in this stack JWT_SECRET/POSTGRES_PASSWORD/every other application
    # secret it has zero use for. Cherry-picked below instead; both values still
    # come from production.env via compose's own ${VAR} substitution (--env-file),
    # not by loading the file into the container.
    environment:
      CADDY_HOST: ${CADDY_HOST:-:80}
      # Unset/absent is fine for local validation (CADDY_HOST=:80 never triggers
      # ACME, so this is never actually read) — see infra/caddy/Caddyfile.
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # read_only root filesystem — Caddy only ever needs to write to /data (certs/
    # OCSP) and /config (autosaved active config), both already mounted as writable
    # named volumes above. /tmp is where Caddy stages some file operations (e.g.
    # atomic writes), so it gets a small writable tmpfs rather than loosening
    # read_only for the whole container.
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      # 443 is always published, even for local validation (CADDY_HOST=:80) — it
      # simply has nothing listening on it in that mode (no TLS server block is
      # created when the site address has no hostname), so publishing it early is
      # harmless. Real HTTPS traffic only exists once CADDY_HOST is a real domain
      # (Sprint 12.3+, DT-012.1 §9).
      - "${CADDY_HTTPS_PORT:-443}:443"
    networks:
      - internal
    # Startup ordering only (Caddy shouldn't start routing before it has somewhere
    # to route to) — NOT a health dependency: Caddy's own healthcheck below never
    # calls frontend/backend, so a frontend/backend outage never makes Caddy itself
    # report unhealthy (see DT-011A.3 §16).
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      # Deliberately checks Caddy's own admin API (bound to 127.0.0.1:2019 inside
      # the container by default, never published to the host/network) instead of
      # the public site block — this verifies only that the Caddy process itself is
      # alive, with zero dependency on the frontend/backend upstreams it proxies to.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 256m
    mem_reservation: 128m
    # PROVISIONAL (Sprint 11A.2 pattern extended here) — Caddy is a lightweight
    # proxy (no JVM/V8, no application state); revisit alongside the other services
    # once a real VPS is chosen (Sprint 11B).
    cpus: "0.5"
    logging: *default-logging
