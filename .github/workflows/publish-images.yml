name: Publish images to GHCR

# Builds and publishes the backend and frontend production images to GHCR,
# tagged immutably by commit SHA (see docs/design/DT-011A.4-ghcr-image-pipeline.md).
#
# Deliberately separate from backend-ci.yml/frontend-ci.yml: those answer "is the
# code correct?" (every PR, every push); this answers "should this commit become a
# published, deployable artifact?" (only main, or an explicit manual run). Never
# triggered by pull_request — a PR never publishes an image.

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/publish-images.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (branch, tag, or commit SHA) to build and publish. Empty = current main.'
        required: false
        default: ''

# Prevents two publishes of the same ref from racing each other. Never cancel a
# publish that's already mid-push — that could leave a half-pushed manifest in GHCR.
concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  BACKEND_IMAGE: ghcr.io/chicaomsc/contractor-platform-backend
  FRONTEND_IMAGE: ghcr.io/chicaomsc/contractor-platform-frontend

jobs:
  backend:
    name: Build & push backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}

      # actions/checkout's default shallow clone (fetch-depth: 1) of an explicit SHA
      # leaves the repo in a detached HEAD with a "grafted" commit (no parent/branch
      # info) — docker/metadata-action's `context: git` tries to resolve a symbolic
      # ref from that state and fails ("Cannot find detached HEAD ref in "grafted,
      # HEAD""). `git rev-parse HEAD`/`--short HEAD` don't need any of that — they
      # just read the commit the checkout already put HEAD at, which exists even in
      # a single-commit shallow clone. No fetch-depth: 0 needed.
      - name: Resolve commit SHA
        id: sha
        run: |
          echo "full=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags + OCI labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          # flavor.latest defaults to "auto", which would silently add a `:latest`
          # tag on top of the ones below whenever this looks like a default-branch
          # build (i.e. every normal push to main) — explicitly disabled since
          # `:latest` must never be published (see DT-011A.4 §10).
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.sha.outputs.full }}
            type=raw,value=${{ steps.sha.outputs.short }}
            type=raw,value=main,enable=${{ github.event_name == 'push' || github.event.inputs.ref == '' || github.event.inputs.ref == 'main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  frontend:
    name: Build & push frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}

      # See the "Resolve commit SHA" step in the backend job for why this doesn't
      # use docker/metadata-action's `context: git` — it fails on the detached,
      # grafted HEAD left by actions/checkout's default shallow clone of a SHA.
      - name: Resolve commit SHA
        id: sha
        run: |
          echo "full=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # NEXT_PUBLIC_* are inlined into the client bundle at build time (Next.js
      # constraint, not a choice made here — see infra/README.md). None of them is
      # a secret, but none has a safe generic default either (see
      # docs/design/DT-011A.4-ghcr-image-pipeline.md §12): NEXT_PUBLIC_COMPANY_SLUG
      # is inherently tenant-specific, and the API/site URLs must match whatever
      # origin Caddy actually serves. Failing clearly here beats silently baking in
      # an empty string or a hardcoded tenant.
      - name: Validate required GitHub Actions Variables
        run: |
          missing=()
          [ -z "${{ vars.NEXT_PUBLIC_API_BASE_URL }}" ] && missing+=(NEXT_PUBLIC_API_BASE_URL)
          [ -z "${{ vars.NEXT_PUBLIC_COMPANY_SLUG }}" ] && missing+=(NEXT_PUBLIC_COMPANY_SLUG)
          [ -z "${{ vars.NEXT_PUBLIC_SITE_URL }}" ] && missing+=(NEXT_PUBLIC_SITE_URL)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required GitHub Actions Variables: ${missing[*]}. Configure them under Settings > Secrets and variables > Actions > Variables before running this workflow. See infra/README.md (\"GitHub Actions Variables\")."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags + OCI labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          # See the backend job's metadata step — flavor.latest defaults to "auto"
          # and would otherwise silently add a `:latest` tag on a main-branch build.
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.sha.outputs.full }}
            type=raw,value=${{ steps.sha.outputs.short }}
            type=raw,value=main,enable=${{ github.event_name == 'push' || github.event.inputs.ref == '' || github.event.inputs.ref == 'main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_COMPANY_SLUG=${{ vars.NEXT_PUBLIC_COMPANY_SLUG }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
          tags: ${{ steps.meta.outputs.tags }}
          # Extra label (beyond metadata-action's standard OCI set) recording which
          # tenant is baked into this specific image — see DT §12: the image name is
          # generic ("contractor-platform-frontend") but its contents are not yet.
          labels: |
            ${{ steps.meta.outputs.labels }}
            io.chicaodw.tenant=${{ vars.NEXT_PUBLIC_COMPANY_SLUG }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
